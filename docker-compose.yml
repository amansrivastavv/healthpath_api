services:
  postgres:
    image: postgres:17-alpine
    container_name: healthpath-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: healthpath

    ports:
      - "5432:5432"

    volumes:
      - healthpath_postgres_data:/var/lib/postgresql/data

volumes:
  healthpath_postgres_data: